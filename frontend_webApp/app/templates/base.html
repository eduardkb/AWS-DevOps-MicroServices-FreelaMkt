<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freela Marketplace{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  <link rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='img/marketplace-icon.svg') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <span class="brand-icon">⬡</span>
        <span class="brand-name">Freela <span class="brand-accent">Marketplace</span></span>
      </div>
      <div class="header-right">
        <!--
          Auth state is managed entirely by auth.js using sessionStorage.
          The #auth-header-section placeholder is populated on DOMContentLoaded.
        -->
        <div id="auth-header-section" aria-live="polite"></div>
      </div>
    </div>

    <!-- NAV TABS -->
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="{{ url_for('main.index') }}"
           class="nav-tab {% if active_tab == 'all_services' %}active{% endif %}">
          <span class="tab-icon">◈</span> All Services
        </a>
        <a href="{{ url_for('services.my_services') }}"
           class="nav-tab {% if active_tab == 'my_services' %}active{% endif %}">
          <span class="tab-icon">◉</span> My Services
        </a>
        <a href="{{ url_for('bookings.my_bookings') }}"
           class="nav-tab {% if active_tab == 'my_bookings' %}active{% endif %}">
          <span class="tab-icon">◎</span> My Bookings
        </a>
      </div>
    </nav>

    <!-- MESSAGE BANNER -->
    <div id="message-banner" class="message-banner" style="display:none;">
      <span id="message-content"></span>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-credit">Developed by <strong>E.K.B</strong> - v{{ config['APP_VERSION'] }}</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
