<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in…</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: #0f0f10;
      color: #e0e0e0;
    }
    .spinner-wrap { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 0.95rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="spinner-wrap">
    <div class="spinner" aria-hidden="true"></div>
    <p>Completing sign-in…</p>
  </div>
  <!--
    auth.js detects window.location.pathname === "/auth/callback",
    reads ?code= and ?state= from the URL, performs the token exchange
    against Cognito directly from the browser, stores tokens in
    sessionStorage, then redirects to "/".
  -->
  <script src="/static/js/auth.js"></script>
</body>
</html>
