{% extends "base.html" %}
{% block title %} - My Profile{% endblock %}

{% block content %}
<div class="form-page">
  <div class="form-card">
    <h1 class="form-title">My Profile</h1>
    <p class="form-subtitle">Your account information</p>

    <div class="form-group">
      <label class="form-label" for="fullname">Full Name</label>
      <input class="form-input" type="text" id="fullname" name="fullname" value="{{ user.get('name', '') }}" disabled />
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" type="email" id="email" name="email" value="{{ user.get('email', '') }}" disabled />
    </div>

    <div class="form-group">
      <label class="form-label" for="sub">User ID</label>
      <input class="form-input" type="text" id="sub" name="sub" value="{{ user.get('sub', '') }}" disabled />
    </div>

    <button class="btn-submit" type="button" disabled>Save Changes</button>

    <p class="form-placeholder-notice">⚠ Profile editing is not yet available. This is a placeholder.</p>
  </div>
</div>
{% endblock %}
