name: 01-Full-Provision

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options:
          - dev
          - test
          - prod
        default: prod
        required: true
  # push:
  #   branches:
  #     - main

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

jobs:
  # ── Job 1: Provision all infrastructure 
  # ──────────────────────────────────
  terraform-apply:
    runs-on: ubuntu-latest
    outputs:
      migration_function_name: ${{ steps.tf_outputs.outputs.migration_function_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::217037953500:role/FreelaMkp-GitCiCd-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com   

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # needed so outputs are clean strings

      # Build psycopg2 for Amazon Linux 2023 before Terraform packages the zip
      - name: Build psycopg2 layer for Lambda
        run: |
          pip install \
            --platform manylinux2014_x86_64 \
            --target db_schema \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            psycopg2-binary boto3

      - name: Terraform Init
        working-directory: terraform/envs/${{ inputs.environment }}/
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/envs/${{ inputs.environment }}/
        run: terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform/envs/${{ inputs.environment }}/
        run: |
          FUNC=$(terraform output -raw migration_function_name)
          echo "migration_function_name=$FUNC" >> "$GITHUB_OUTPUT"

  # ── Job 2: Run DB migration via Lambda ───────────────────────────────────
  db-migrate:
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::217037953500:role/FreelaMkp-GitCiCd-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Invoke migration Lambda
        run: |
          RESPONSE=$(aws lambda invoke \
            --function-name "${{ needs.terraform-apply.outputs.migration_function_name }}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            response.json)

          # Print Lambda tail logs (base64-encoded in the response)
          echo "$RESPONSE" | jq -r '.LogResult' | base64 --decode || true

          # Read the actual function response
          cat response.json

          # Fail the job if Lambda returned an error
          SUCCESS=$(cat response.json | jq -r '.success // false')
          if [ "$SUCCESS" != "true" ]; then
            echo "Migration Lambda returned an error!"
            exit 1
          fi